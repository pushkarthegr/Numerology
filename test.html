<!DOCTYPE html>
<html>
<head>
  <title>Google Login</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #login-result {
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div>
    <div id="g_id_signin"></div>
    <div id="login-result"></div>
  </div>

  <script src="script.js"></script>
</body>
<script>
    // List of pre-authorized emails
const authorizedEmails = [
  "user1@example.com",
  "user2@example.com",
  "admin@example.com"
];

// Initialize Google Sign-In
window.onload = function () {
  google.accounts.id.initialize({
    client_id: "530639179362-09mol77ad3ie3k97943t8te3stuglbkk.apps.googleusercontent.com",
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById("g_id_signin"),
    { theme: "outline", size: "large" }
  );
};

function handleCredentialResponse(response) {
  const jwt = response.credential;
  const payload = JSON.parse(atob(jwt.split('.')[1])); // decode JWT payload

  const userEmail = payload.email;
  const result = authorizedEmails.includes(userEmail);

  document.getElementById("login-result").innerText = result ? "True" : "False";
}

</script>
</html>
