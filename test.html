<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numerology — Sign in</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://www.gstatic.com/firebasejs/7.6.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.6.2/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/live/3.1/firebase.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body onload="load()">
  <div class="centered-page">
    <main class="auth-card">
      <div class="brand center"><span class="brand-mark">✦</span> Numerology</div>
      <p class="auth-sub">Sign in with Google to open your dasha workspace.</p>

      <div id="g_id_signin" class="gbtn"></div>
      <div id="login-result"></div>

      <h2 id="showme" class="auth-email"></h2>
      <p class="auth-foot">Access is limited to authorized readers.</p>
    </main>
  </div>
  <script src="script.js"></script>
<script>
    function load(){
        if(localStorage.getItem("isLoggedIn") == "true"){
            alert("You are already logged in!");
            window.location = "index.html";
        }
    }
    const firebaseConfig = {
                apiKey: "AIzaSyD5FHdRtRtAZHVAdaXOTIAG7qPVJApzOFk",
                authDomain: "stock-fd93b.firebaseapp.com",
                databaseURL:"https://stock-fd93b-default-rtdb.firebaseio.com",
                projectId: "stock-fd93b",
                storageBucket: "stock-fd93b.appspot.com",
                messagingSenderId: "545670483992",
                appId: "1:545670483992:web:2665cfd669b86bc662f36d",
            };
            firebase.initializeApp(firebaseConfig);
    // List of pre-authorized emails
authorizedEmails = [];
firebase.database().ref("/" + "StockShow/-OPJwnmNjbhL-Y-5ZfOy").on('value', function (snapshot) {
              snapshot.forEach(function (childSnapshot) {
                        childKey = childSnapshot.key;
                        values_main = childKey;
                        values = childSnapshot.val();
                        authorizedEmails = values;
                });
          });

// Initialize Google Sign-In
window.onload = function () {
  google.accounts.id.initialize({
    client_id: "530639179362-09mol77ad3ie3k97943t8te3stuglbkk.apps.googleusercontent.com",
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById("g_id_signin"),
    { theme: "outline", size: "large" }
  );
};

function handleCredentialResponse(response) {
  const jwt = response.credential;
  const payload = JSON.parse(atob(jwt.split('.')[1])); // decode JWT payload

  const userEmail = payload.email;
  const result = authorizedEmails.includes(userEmail);
  document.getElementById("showme").innerHTML = userEmail.toString();
  if(result == true){
    window.location = "index.html";
    localStorage.setItem("isLoggedIn", "true");
  }else{
    alert("You are not a verified user!");
    firebase.database().ref("/" + "StockShow/-OPJwnmNjbhL-Y-5ZfOy").on('value', function (snapshot) {
              snapshot.forEach(function (childSnapshot) {
                        childKey = childSnapshot.key;
                        values_main = childKey;
                        values = childSnapshot.val();
                        authorizedEmails = values;
                });
          });
  }
}

</script>
</body>
</html>
