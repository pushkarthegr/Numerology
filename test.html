<!DOCTYPE html>
<html>
<head>
  <title>Numerology Login</title>

  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #login-result {
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body onload="load()">
  <div>
    <div id="g_id_signin"></div>
    <div id="login-result"></div>
  </div>
<br><br>
  <h2 id="showme"></h2>
  <script src="script.js"></script>
</body>
<script>
    function load(){
        if(localStorage.getItem("isLoggedIn") == "true"){
            alert("You are already logged in!");
            window.location = "index.html";
        }
    }
    const firebaseConfig = {
                apiKey: "AIzaSyD5FHdRtRtAZHVAdaXOTIAG7qPVJApzOFk",
                authDomain: "stock-fd93b.firebaseapp.com",
                databaseURL:"https://stock-fd93b-default-rtdb.firebaseio.com",
                projectId: "stock-fd93b",
                storageBucket: "stock-fd93b.appspot.com",
                messagingSenderId: "545670483992",
                appId: "1:545670483992:web:2665cfd669b86bc662f36d",
            };
            firebase.initializeApp(firebaseConfig);
    // List of pre-authorized emails
authorizedEmails = [];
firebase.database().ref("/" + "StockShow/-OPJwnmNjbhL-Y-5ZfOy").on('value', function (snapshot) {
              snapshot.forEach(function (childSnapshot) {
                        childKey = childSnapshot.key; 
                        values_main = childKey;
                        values = childSnapshot.val();
                        authorizedEmails = values;
                });
          });

// Initialize Google Sign-In
window.onload = function () {
  google.accounts.id.initialize({
    client_id: "530639179362-09mol77ad3ie3k97943t8te3stuglbkk.apps.googleusercontent.com",
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById("g_id_signin"),
    { theme: "outline", size: "large" }
  );
};

function handleCredentialResponse(response) {
  const jwt = response.credential;
  const payload = JSON.parse(atob(jwt.split('.')[1])); // decode JWT payload

  const userEmail = payload.email;
  const result = authorizedEmails.includes(userEmail);
  document.getElementById("showme").innerHTML = userEmail.toString();
  if(result == true){
    window.location = "index.html";
    localStorage.setItem("isLoggedIn", "true");
  }else{
    alert("You are not a verified user!");
  }
}

</script>
</html>
