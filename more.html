<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    body {

      background: #f0f4f8;

      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 300px;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 24px;
      color: #333;
    }

    }

      flex: 1;
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;

    button {

      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
