<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numerology — Manage Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://www.gstatic.com/firebasejs/7.6.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.6.2/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/live/3.1/firebase.js"></script>
</head>
<body>

  <div class="centered-page">
    <main class="auth-card">
      <a class="backlink" href="index.html">← Back to charts</a>
      <div class="brand center"><span class="brand-mark">✦</span> Numerology</div>
      <p class="auth-sub">Add or remove an authorized reader by name.</p>

      <div class="stack">
        <input type="text" class="input" placeholder="Enter a name" id="nameInput" autocomplete="off">
        <div class="btn-row">
          <button class="btn btn-primary" onclick="handleInput()" id="enter">Add</button>
          <button class="btn btn-danger" onclick="removes()" id="remo">Remove</button>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(function () { t.classList.remove("show"); }, 2200);
    }

    arra = [];
    const firebaseConfig = {
                apiKey: "AIzaSyD5FHdRtRtAZHVAdaXOTIAG7qPVJApzOFk",
                authDomain: "stock-fd93b.firebaseapp.com",
                databaseURL:"https://stock-fd93b-default-rtdb.firebaseio.com",
                projectId: "stock-fd93b",
                storageBucket: "stock-fd93b.appspot.com",
                messagingSenderId: "545670483992",
                appId: "1:545670483992:web:2665cfd669b86bc662f36d",
            };
            firebase.initializeApp(firebaseConfig);
            firebase.database().ref("/" + "StockShow/-OPJwnmNjbhL-Y-5ZfOy").on('value', function (snapshot) {
              snapshot.forEach(function (childSnapshot) {
                        childKey = childSnapshot.key;
                        values_main = childKey;
                        values = childSnapshot.val();
                        arra = values;
                });
          });
    function handleInput() {
        arra.push(document.getElementById("nameInput").value.toLowerCase());
        firebase.database().ref("StockShow/-OPJwnmNjbhL-Y-5ZfOy").update({
            Image:arra
          });
        showToast("Name added");
      document.getElementById("nameInput").value = "";
    }
    function removes(){
        const valueToRemove = document.getElementById("nameInput").value; // change this to the value you want to remove
        arra = arra.filter(item => item !== valueToRemove);
        firebase.database().ref("StockShow/-OPJwnmNjbhL-Y-5ZfOy").update({
            Image:arra
          });
        showToast("Name removed");
      document.getElementById("nameInput").value = "";
    }

  </script>

</body>
</html>
