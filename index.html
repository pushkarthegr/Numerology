<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerology — Dasha Chart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body onload="load()">

    <header class="appbar">
        <div class="wrap appbar-inner">
            <a class="brand" href="index.html"><span class="brand-mark">✦</span> Numerology</a>
            <button class="btn btn-ghost" id="logout" onclick="logou()">Log out</button>
        </div>
    </header>

    <main class="wrap">

        <!-- Input panel -->
        <section class="panel">
            <h1 class="panel-title">Dasha chart</h1>
            <p class="panel-sub">Enter a birth date to map the Mahadasha, Antardasha and Pratianter cycles.</p>

            <div class="controls">
                <div class="field">
                    <label class="lbl" for="birthdate">Birth date</label>
                    <input type="text" class="input" id="birthdate" placeholder="DD-MM-YYYY" autocomplete="off">
                </div>
                <div class="field">
                    <label class="lbl" for="inputyear">Start year</label>
                    <input type="number" class="input" id="inputyear" inputmode="numeric">
                </div>
            </div>

            <button onclick="basic()" class="btn btn-primary btn-block" id="mainbutton">Generate charts</button>

            <p id="info" class="info"></p>
        </section>

        <!-- Birth grid + legend -->
        <section class="panel">
            <div class="panel-head-row">
                <h2 class="panel-title sm">Birth grid</h2>
                <div class="legend">
                    <span><span class="dot root"></span>Root</span>
                    <span><span class="dot dest"></span>Destiny</span>
                </div>
            </div>

            <table class="numgrid" id="god">
                <tbody>
                    <tr>
                        <td id="three">&nbsp;</td>
                        <td id="one">&nbsp;</td>
                        <td id="nine">&nbsp;</td>
                    </tr>
                    <tr>
                        <td id="six">&nbsp;</td>
                        <td id="seven">&nbsp;</td>
                        <td id="five">&nbsp;</td>
                    </tr>
                    <tr>
                        <td id="two">&nbsp;</td>
                        <td id="eight">&nbsp;</td>
                        <td id="four">&nbsp;</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Generated year-by-year charts -->
        <div id="tableContainer" class="years">
            <div class="empty">
                <span class="glyph">✦</span>
                Pick a birth date and start year, then tap <strong>Generate charts</strong> to see the dasha timeline.
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="bruh.js"></script>
    <script src="main.js"></script>
    <script>
        function logou(){
            localStorage.removeItem("isLoggedIn");
            window.location = "test.html";
        }
    </script>
</body>
</html>
